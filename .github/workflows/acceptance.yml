name: mixed acceptance
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Optional comma-separated scenario name filters; empty runs all cases
        type: string
        required: false
        default: "alpha8-mixed,mixed-normal-native-artifacts-dry-nochange,mixed-partial-fresh-clone,alpha7-mixed-nested,settings-mixed-true-divergence-alpha-main-backmerge,settings-mixed-private-excluded-deepest-colocation,oidc-accepted-retry-credentials-1"
permissions:
  contents: read
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  controlled:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.22.1
            npm: 12.2.1
            lane: CANONICAL_NPM12
            scenarios: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: npm ci --prefix support/sigstore-tools --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance.mjs
        env:
          EVIDENCE_LABEL: alpha8/mixed/${{ matrix.lane }}
          SCENARIOS: ${{ inputs.scenarios || matrix.scenarios }}
          PACKAGING_LANE: ${{ matrix.lane }}
          EXPECTED_NPM: ${{ matrix.npm }}
          EXPECTED_NODE: ${{ matrix.node }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mixed-acceptance-evidence-${{ matrix.node }}-npm${{ matrix.npm }}
          path: evidence/alpha8/mixed/
