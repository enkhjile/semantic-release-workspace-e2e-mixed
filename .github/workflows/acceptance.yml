name: mixed acceptance
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Optional comma-separated scenario name filters; empty runs all cases
        type: string
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  controlled:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.11.0
            npm: 11.21.1
            lane: SUPPORTED_FLOOR
          - node: 24.22.1
            npm: 12.2.1
            lane: CANONICAL_NPM12
          - node: 24.22.1
            npm: 11.21.1
            lane: NPM11_COMPATIBILITY
          - node: 26.12.1
            npm: 12.2.1
            lane: LATEST_NODE_NPM12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: npm ci --prefix support/sigstore-tools --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance.mjs
        env:
          EVIDENCE_LABEL: alpha6/mixed/${{ matrix.lane }}
          SCENARIOS: ${{ inputs.scenarios }}
          PACKAGING_LANE: ${{ matrix.lane }}
          EXPECTED_NPM: ${{ matrix.npm }}
          EXPECTED_NODE: ${{ matrix.node }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mixed-acceptance-evidence-${{ matrix.node }}-npm${{ matrix.npm }}
          path: evidence/alpha6/mixed/
